name: Tests

on:
  pull_request:
    types:
      - labeled
      - synchronize

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    # Run only when ready-for-build is newly added, or when it is already
    # present and new commits are pushed. Adding any other label must not run.
    if: >-
      (
        github.event.action == 'synchronize' &&
        contains(github.event.pull_request.labels.*.name, 'ready-for-build')
      ) ||
      (
        github.event.action == 'labeled' &&
        github.event.label.name == 'ready-for-build'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v20

      - name: Install and start nscd
        run: |
          sudo apt-get update
          sudo apt-get install --yes nscd
          sudo systemctl start nscd
          test -S /var/run/nscd/socket

      - name: Run tests
        run: ./tests/run-tests.sh
